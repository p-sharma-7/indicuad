    enable_thinking: false
    max_new_tokens: 512
    gated: true
    gated_note: "HF Hub reports gated=manual. Requires HF_TOKEN with Meta's Llama 3.1 license accepted for this account."
    notes: >
      Mainstream, widely-used family not otherwise represented in this
      registry (inlegalllama_fp16 is Llama *2*-based; this is a materially
      newer generation). Standard architecture, long-supported by
      transformers==4.51.3 — runs in the proven primary indicuad-bench-v2
      env, not indicuad-bench-v2-gemma4. ~16.1 GB download. Registered per
      operator direction to diversify family representation with a SOTA,
      mainstream general baseline. context_budget_tokens raised 32768->65536
      on 2026-08-19 — Llama 3.1 natively supports up to 131072 via its
      built-in rope_scaling, but 65536 was chosen as the safe ceiling on a
      shared 32 GiB V100 (observed peak ~17.4 GiB at 32768; +~4.2 GiB KV
      cache for the extra 32768 tokens leaves ~11 GiB headroom). Going all
      the way to 131072 would leave only ~2 GiB headroom under contention —
      too risky on a card shared with other users.

