# IndiCUAD model registry: the twelve systems evaluated in the paper (Table 2).
#
# Every checkpoint is pinned to an exact Hugging Face revision. Causal LMs are
# decoded greedily (do_sample=false) with max_new_tokens below; fp16 unless
# quantization: bnb_nf4. context_budget_tokens is the per-model full_contract
# budget: a prompt that does not fit (budget - max_new_tokens - 32) is recorded
# as context_exceeds_model_capacity and left unscored.
#
# The matched base checkpoints (Mistral-7B-v0.1, Llama-2-7B) are run by
# results/base_model_ablation/run_model.py, not by this registry.

models:

  - model_key: qwen3_32b_4bit
    display_name: "Qwen3-32B (4-bit NF4)"
    hf_id: Qwen/Qwen3-32B
    revision: 9216db5781bf21249d130ec9da846c4624c16137
    family: qwen3
    model_type: causal_lm
    role: large_model_attempt
    param_scale_b: 32.8
    license: apache-2.0
    default_dtype: fp16
    quantization: bnb_nf4
    context_budget_tokens: 40960
    v100_feasibility: ATTEMPT_WITH_PREFLIGHT
    vram_class_gib: 20.5
    required_dependencies: [transformers, accelerate, safetensors, tokenizers, bitsandbytes]
    trust_remote_code: false
    inference_template: qwen3_chat
    enable_thinking: false
    max_new_tokens: 512
    preflight_min_free_vram_gib: 28.0
    allow_auto_shard: true
    shard_min_free_vram_gib_per_gpu: 26.0
    notes: "Weights ~20.5 GiB in 4-bit; KV cache at 8192 context is the risk on a single 32 GiB V100. Attempt single-GPU first if preflight clears 28 GiB free; auto_shard across GPU 1+3 is opt-in for extra headroom, never default. context_budget_tokens raised 32768->40960 on 2026-08-19 to match Qwen3's native max_position_embeddings — checked against observed peak VRAM (~21.6 GiB at 32768) plus the ~+2.1 GiB KV-cache delta for the extra 8192 tokens; still ~9 GiB headroom on a 32 GiB card."

