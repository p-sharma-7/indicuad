  - model_key: inlegalbert
    display_name: "InLegalBERT (encoder, zero-shot embedding span-ranking adapter)"
    hf_id: law-ai/InLegalBERT
    revision: b5ecfed8ed6cf9d25a3cb8225a8c52f161f7401a
    family: inlegalbert
    model_type: extractive_qa
    role: india_litigation_encoder
    param_scale_b: 0.11
    license: mit
    default_dtype: fp32
    quantization: none
    context_budget_tokens: 512
    v100_feasibility: FEASIBLE_FP16
    vram_class_gib: 0.5
    required_dependencies: [transformers, accelerate, safetensors, tokenizers]
    trust_remote_code: false
    inference_template: embedding_span_ranking
    adapter_type: embedding_span_ranking
    max_new_tokens: null
    max_seq_length: 256
    notes: >
      law-ai/InLegalBERT ships as a fill-mask MLM checkpoint with no
      pretrained extractive-QA span head (re-confirmed against the live Hub
      API 2026-08-18: pipeline_tag=fill-mask). This harness does not
      fine-tune models, and attaching AutoModelForQuestionAnswering would
      bolt on a *randomly initialized* head whose output carries no signal
      from the checkpoint's actual training — scoring that and calling it
      "InLegalBERT performance" would misrepresent the model.
      Spec §9 explicitly names "extractive QA/span-ranking adapter" as the
      sanctioned pattern, so this entry uses a genuine zero-shot span-
      ranking adapter instead (benchmark/models/embedding_ranker.py):
      InLegalBERT's own pretrained encoder mean-pools an embedding for the
      question and for every candidate paragraph, paragraphs are ranked by
      cosine similarity, and the top-ranked *whole paragraph* is returned
      as the predicted span. This is real use of the checkpoint's learned
      representations with zero fabricated training — but it is
      architecturally distinct from a trained extractive-QA model
      (cuad_legalbert_or_roberta) in two ways every report must keep
      visible: (1) it returns whole-paragraph spans, not minimal token
      spans, so precision is structurally disadvantaged; (2) it has no
      supervised "is this the answer" signal at all, only unsupervised
      similarity. Every raw/scored record is tagged
      adapter_type=embedding_span_ranking so this is never silently
      compared apples-to-apples against a trained QA head. The original
      sliding-window trained-QA-head adapter (benchmark/models/
      hf_extractqa.py) remains available and is what cuad_legalbert_or_roberta
      uses; it would be used here too if a legitimate InLegalBERT QA
      fine-tune is registered later (only a low-adoption community
      fine-tune was found: kinshuk-h/InLegalBERT-cbp-lkg-qa-triples-w-
      context-finetuned, 7 downloads — not used).

